[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-platform"
version = "1.0.0"
description = "Meridian Life Sciences Enterprise AI Platform - Usage Ingestion, Admin Service, Scoped MCP Connector & Environment Provisioning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
    "mcp>=1.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
meridian-api = "meridian.api.app:run"
meridian-mcp = "meridian.mcp.runner:main"
meridian-provision = "meridian.provision.render:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
