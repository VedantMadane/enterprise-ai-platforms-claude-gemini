name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install TypeScript dependencies
        working-directory: ./connector-ts
        run: pnpm install

      - name: Run TypeScript test suite
        working-directory: ./connector-ts
        run: |
          pnpm run build
          pnpm run test

      - name: Run Python test suite with coverage
        run: |
          pytest -v --cov=meridian --cov-report=xml --cov-report=term

      - name: Run Automated Provisioning & Validation
        run: |
          python scripts/provision.py

      - name: Run Security & MCP Verification Transcript
        run: |
          python scripts/demo_transcript.py
